<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png?v=6" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="color-scheme" content="only dark" />
    <meta name="supported-color-schemes" content="only light only dark" />
    <meta name="darkreader-lock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Trade prediction markets with AI insights. Simple, fast, and secure." />
    <title>nourmarket</title>
    <style>
      /* Block Brave / browser-level dark mode filter inversion */
      html, body, #root {
        filter: none !important;
        -webkit-filter: none !important;
        forced-color-adjust: none !important;
        -ms-high-contrast-adjust: none !important;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.dark) {
          color-scheme: only light !important;
          background-color: #efede3 !important;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("nour-theme");
          var metaCS = document.querySelector('meta[name="color-scheme"]');
          var metaTC = document.querySelector('meta[name="theme-color"]');
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
            if (metaCS) metaCS.setAttribute("content", "only light");
            if (metaTC) metaTC.setAttribute("content", "#efede3");
          } else {
            document.documentElement.classList.add("dark");
            if (metaCS) metaCS.setAttribute("content", "only dark");
            if (metaTC) metaTC.setAttribute("content", "#1c1c1c");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
